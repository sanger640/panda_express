<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Robot Teleop - Advanced</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            min-width: 250px;
        }
        .status-good { color: #00ff00; }
        .status-bad { color: #ff0000; }
        .status-warn { color: #ffaa00; }
    </style>
</head>
<body>
    <div id="info">
        <div><strong>Quest Robot Teleoperation</strong></div>
        <hr>
        <div>Status: <span id="status" class="status-bad">Not Connected</span></div>
        <div>Position: <span id="position">-</span></div>
        <div>Trigger: <span id="trigger">0.0</span></div>
        <div>Grip: <span id="grip">0.0</span></div>
        <div style="display: flex; gap: 10px;">
            <div>Btn A: <span id="btn-a">0</span></div>
            <div>Btn B: <span id="btn-b">0</span></div>
        </div>
        <div style="display: flex; gap: 10px;">
            <div>Btn X: <span id="btn-x">0</span></div>
            <div>Btn Y: <span id="btn-y">0</span></div>
        </div>
        <hr>
        <div style="font-size: 12px;">
            <div>Right: Pos/Rot, A (Aux 1), B (Aux 2)</div>
            <div>Left: X (Aux 3), Y (Aux 4)</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        // ===== CONFIGURATION =====
        const WEBSOCKET_URL = 'wss://192.168.18.12:8765'; 
        // =========================

        let scene, camera, renderer;
        let controller1, controller2;
        let ws;
        let isConnected = false;

        // Status elements
        const statusEl = document.getElementById('status');
        const positionEl = document.getElementById('position');
        const triggerEl = document.getElementById('trigger');
        const gripEl = document.getElementById('grip');
        const btnAEl = document.getElementById('btn-a');
        const btnBEl = document.getElementById('btn-b');
        const btnXEl = document.getElementById('btn-x'); // New
        const btnYEl = document.getElementById('btn-y'); // New

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x303030);
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 3);

            scene.add(new THREE.GridHelper(10, 20, 0x888888, 0x444444));
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            setupControllers();
            connectWebSocket();
            window.addEventListener('resize', onWindowResize);
        }

        function setupControllers() {
            const controllerModelFactory = new XRControllerModelFactory();
            // Right
            controller1 = renderer.xr.getController(0);
            scene.add(controller1);
            const grip1 = renderer.xr.getControllerGrip(0);
            grip1.add(controllerModelFactory.createControllerModel(grip1));
            scene.add(grip1);

            // Left
            controller2 = renderer.xr.getController(1);
            scene.add(controller2);
            const grip2 = renderer.xr.getControllerGrip(1);
            grip2.add(controllerModelFactory.createControllerModel(grip2));
            scene.add(grip2);
        }

        function connectWebSocket() {
            try {
                ws = new WebSocket(WEBSOCKET_URL);
                ws.onopen = () => {
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'status-good';
                    isConnected = true;
                };
                ws.onclose = () => {
                    statusEl.textContent = 'Disconnected';
                    statusEl.className = 'status-bad';
                    isConnected = false;
                    setTimeout(connectWebSocket, 3000);
                };
            } catch (error) {
                setTimeout(connectWebSocket, 3000);
            }
        }

        function sendControllerData() {
            if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) return;

            const session = renderer.xr.getSession();
            if (!session) return;

            let data = {
                position: [0, 0, 0],
                orientation: [0, 0, 0, 1],
                trigger: 0,
                grip: 0,
                button_a: 0,
                button_b: 0,
                button_x: 0, // New
                button_y: 0  // New
            };

            const referenceSpace = renderer.xr.getReferenceSpace();
            const frame = renderer.xr.getFrame();

            session.inputSources.forEach((source) => {
                if (!source.gamepad) return;

                // RIGHT CONTROLLER (Position, Trigger, Grip, A, B)
                if (source.handedness === 'right') {
                    const pose = frame?.getPose(source.gripSpace, referenceSpace);
                    if (pose) {
                        data.position = [pose.transform.position.x, pose.transform.position.y, pose.transform.position.z];
                        data.orientation = [pose.transform.orientation.x, pose.transform.orientation.y, pose.transform.orientation.z, pose.transform.orientation.w];
                    }
                    data.trigger = source.gamepad.buttons[0]?.value || 0;
                    data.grip = source.gamepad.buttons[1]?.value || 0;
                    data.button_a = source.gamepad.buttons[4]?.value || 0;
                    data.button_b = source.gamepad.buttons[5]?.value || 0;
                }

                // LEFT CONTROLLER (X, Y)
                if (source.handedness === 'left') {
                    data.button_x = source.gamepad.buttons[4]?.value || 0;
                    data.button_y = source.gamepad.buttons[5]?.value || 0;
                }
            });

            // Send and Update UI
            ws.send(JSON.stringify(data));

            positionEl.textContent = `${data.position[0].toFixed(2)}, ${data.position[1].toFixed(2)}, ${data.position[2].toFixed(2)}`;
            triggerEl.textContent = data.trigger.toFixed(2);
            gripEl.textContent = data.grip.toFixed(2);
            btnAEl.textContent = data.button_a.toFixed(0);
            btnBEl.textContent = data.button_b.toFixed(0);
            btnXEl.textContent = data.button_x.toFixed(0);
            btnYEl.textContent = data.button_y.toFixed(0);

            // Visual Colors
            btnXEl.style.color = data.button_x > 0.5 ? '#ff00ff' : '#ffffff';
            btnYEl.style.color = data.button_y > 0.5 ? '#ff00ff' : '#ffffff';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                sendControllerData();
                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
